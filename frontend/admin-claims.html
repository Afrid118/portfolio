<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Claims - Lost &amp; Found Portal For Campus</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    .admin-table th { padding: 1rem; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-weight: 500; }
    .admin-table td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
    .admin-table tr:hover { background: rgba(255,255,255,0.02); }
    .action-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); transition: color 0.2s; padding: 0.25rem; }
    .action-btn:hover { color: var(--white); }
    .expandable-row { display: none; background: rgba(0,0,0,0.2); }
    .expandable-row.open { display: table-row; }
  </style>
</head>
<body class="aurora-bg">

  <div id="navbar"></div>

  <aside class="sidebar" id="admin-sidebar">
    <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin: 1rem 1rem 0.5rem;">Management</div>
    <a href="./admin-dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="./admin-reports.html" class="sidebar-link"><i data-lucide="file-text"></i> Reports</a>
    <a href="./admin-claims.html" class="sidebar-link active"><i data-lucide="shield-check"></i> Claims</a>
    <a href="./admin-users.html" class="sidebar-link"><i data-lucide="users"></i> Users</a>
  </aside>

  <div class="admin-main main-content" style="padding-top: 70px;">
    <div class="container" style="max-width: 100%;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="margin: 0;">Manage Claims</h1>
        <select class="form-select" id="filter-status" style="width: 150px;">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <div class="glass-card" style="padding: 0; overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Item Name</th>
              <th>Claimant</th>
              <th>Date Submitted</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="5" style="text-align:center;"><div class="spinner" style="margin: 2rem auto;"></div></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/navbar.js"></script>
  <script>
    requireAdmin();
    
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavbar('admin-claims');
      
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('status')) document.getElementById('filter-status').value = urlParams.get('status');
      
      loadData();
      document.getElementById('filter-status').addEventListener('change', loadData);
    });

    async function loadData() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;"><div class="spinner" style="margin: 2rem auto;"></div></td></tr>';

      const status = document.getElementById('filter-status').value;
      const params = {};
      if (status) params.status = status;

      const res = await Claims.adminGetAll(params);
      
      if (res.ok) {
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-secondary);">No claims found.</td></tr>';
          return;
        }

        tbody.innerHTML = res.data.map(c => `
          <tr>
            <td>
              <div style="font-weight: 500;">${truncate(c.itemId?.itemName || 'Deleted item', 30)}</div>
              ${c.itemId ? `<a href="./item-details.html?id=${c.itemId._id}" target="_blank" style="font-size:0.75rem; color:var(--aurora-cyan);">View Item &rarr;</a>` : ''}
            </td>
            <td>
              <div>${c.claimantId?.name || 'Deleted user'}</div>
              <div style="font-size: 0.75rem; color: var(--text-secondary);">${c.claimantId?.email || 'N/A'}</div>
            </td>
            <td>${formatDate(c.createdAt)}</td>
            <td>${getStatusBadge(c.status)}</td>
            <td>
              <div style="display:flex; gap:0.5rem;">
                <button class="action-btn" title="View Details" onclick="toggleRow('${c._id}')"><i data-lucide="chevron-down" style="width:18px;"></i></button>
                ${c.status === 'pending' ? `
                  <button class="action-btn" title="Approve" style="color:var(--aurora-cyan);" onclick="updateStatus('${c._id}', 'approved')"><i data-lucide="check-circle" style="width:18px;"></i></button>
                  <button class="action-btn" title="Reject" style="color:var(--danger);" onclick="updateStatus('${c._id}', 'rejected')"><i data-lucide="x-circle" style="width:18px;"></i></button>
                ` : ''}
              </div>
            </td>
          </tr>
          <tr id="row-${c._id}" class="expandable-row">
            <td colspan="5" style="padding: 1.5rem;">
              <div style="display:flex; gap:2rem;">
                <div style="flex:1;">
                  <h4 style="margin-bottom:0.5rem; color:var(--aurora-cyan);">Proof of Ownership</h4>
                  <p style="color:var(--text-secondary); font-style:italic; white-space:pre-wrap;">"${c.reason}"</p>
                </div>
                <div style="width:250px;">
                  <h4 style="margin-bottom:0.5rem;">Claimant Contact</h4>
                  <div style="color:var(--text-secondary); font-size:0.875rem;">Email: ${c.contactEmail || c.claimantId?.email || 'N/A'}</div>
                  <div style="color:var(--text-secondary); font-size:0.875rem;">Phone: ${c.contactPhone || c.claimantId?.phone || 'N/A'}</div>
                </div>
              </div>
            </td>
          </tr>
        `).join('');
        initLucide();
      } else {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--danger);">Failed to load data.</td></tr>';
      }
    }

    function toggleRow(id) {
      const row = document.getElementById(`row-${id}`);
      row.classList.toggle('open');
    }

    async function updateStatus(id, status) {
      if(!confirm(`Are you sure you want to mark this claim as ${status}?`)) return;
      const res = await Claims.adminUpdateStatus(id, { status });
      if (res.ok) {
        showToast(`Claim updated to ${status}`);
        loadData();
      } else {
        showToast(res.data.message || 'Update failed', 'error');
      }
    }
  </script>
</body>
</html>
