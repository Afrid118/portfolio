<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports - Lost &amp; Found Portal For Campus</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="aurora-bg">

  <div id="navbar"></div>

  <div class="main-content">
    <div class="container">
      <h1 style="margin-bottom: 2rem;">My Activity</h1>

      <div class="tabs" id="report-tabs">
        <div class="tab active" data-tab="all">All Reports</div>
        <div class="tab" data-tab="lost">Lost Items</div>
        <div class="tab" data-tab="found">Found Items</div>
        <div class="tab" data-tab="claims">My Claims</div>
      </div>

      <div id="items-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
        <div class="spinner" style="grid-column: 1/-1; margin: 3rem auto;"></div>
      </div>

    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/navbar.js"></script>
  <script>
    requireAuth();
    
    let myItems = [];
    let myClaims = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await initNavbar('my-reports');
      
      const itemsRes = await Items.getMy();
      if(itemsRes.ok) myItems = itemsRes.data;

      const claimsRes = await Claims.getMy();
      if(claimsRes.ok) myClaims = claimsRes.data;

      renderTab('all');

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          renderTab(e.target.dataset.tab);
        });
      });
    });

    function renderTab(tabName) {
      const grid = document.getElementById('items-grid');
      let data = [];
      let isClaims = false;

      if (tabName === 'all') data = myItems;
      else if (tabName === 'lost') data = myItems.filter(i => i.type === 'lost');
      else if (tabName === 'found') data = myItems.filter(i => i.type === 'found');
      else if (tabName === 'claims') { data = myClaims; isClaims = true; }

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <i data-lucide="inbox"></i>
            <h3>No ${tabName === 'claims' ? 'claims' : 'items'} found</h3>
            <p>You haven't ${tabName === 'claims' ? 'submitted any claims' : 'posted any reports'} yet.</p>
          </div>
        `;
        initLucide();
        return;
      }

      if (isClaims) {
        grid.innerHTML = data.map(claim => `
          <div class="glass-card item-card">
            <div class="item-card-header" style="margin-bottom: 1rem;">
              <div class="item-card-title">Claim for: ${claim.itemId?.itemName || 'Deleted item'}</div>
              ${getStatusBadge(claim.status)}
            </div>
            <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1rem; flex: 1;">
              <div>Submitted: ${formatDate(claim.createdAt)}</div>
              <div style="margin-top: 0.5rem; background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 4px;">
                "<i>${truncate(claim.reason, 80)}</i>"
              </div>
            </div>
            ${claim.itemId ? `<a href="./item-details.html?id=${claim.itemId._id}" class="btn btn-secondary" style="width:100%;">View Item</a>` : ''}
          </div>
        `).join('');
      } else {
        grid.innerHTML = data.map(item => `
          <div class="glass-card item-card">
            <img src="${getImageUrl(item.photo || item.photoUrl)}" class="item-card-img" alt="${item.itemName}">
            <div class="item-card-header">
              <div class="item-card-title" title="${item.itemName}">${item.itemName}</div>
              ${getStatusBadge(item.status)}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
               ${getStatusBadge(item.type)}
               <span style="font-size:0.75rem; color:var(--text-secondary);">${formatDate(item.date)}</span>
            </div>
            <a href="./item-details.html?id=${item._id}" class="btn btn-secondary" style="width:100%;">Manage Report</a>
          </div>
        `).join('');
      }
      initLucide();
    }
  </script>
</body>
</html>
