<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Users - Lost &amp; Found Portal For Campus</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    .admin-table th { padding: 1rem; border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-weight: 500; }
    .admin-table td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
    .admin-table tr:hover { background: rgba(255,255,255,0.02); }
    .action-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); transition: color 0.2s; padding: 0.25rem; }
    .action-btn:hover { color: var(--white); }
  </style>
</head>
<body class="aurora-bg">

  <div id="navbar"></div>

  <aside class="sidebar" id="admin-sidebar">
    <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin: 1rem 1rem 0.5rem;">Management</div>
    <a href="./admin-dashboard.html" class="sidebar-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="./admin-reports.html" class="sidebar-link"><i data-lucide="file-text"></i> Reports</a>
    <a href="./admin-claims.html" class="sidebar-link"><i data-lucide="shield-check"></i> Claims</a>
    <a href="./admin-users.html" class="sidebar-link active"><i data-lucide="users"></i> Users</a>
  </aside>

  <div class="admin-main main-content" style="padding-top: 70px;">
    <div class="container" style="max-width: 100%;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="margin: 0;">Manage Users</h1>
        <div class="search-bar" style="width: 250px;">
          <i data-lucide="search"></i>
          <input type="text" class="form-input" id="search-input" placeholder="Search users...">
        </div>
      </div>

      <div class="glass-card" style="padding: 0; overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>University ID</th>
              <th>Type</th>
              <th>Department</th>
              <th>Contact</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="7" style="text-align:center;"><div class="spinner" style="margin: 2rem auto;"></div></td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/navbar.js"></script>
  <script>
    requireAdmin();
    
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavbar('admin-users');
      loadData();

      const debouncedSearch = debounce(loadData, 300);
      document.getElementById('search-input').addEventListener('input', debouncedSearch);
    });

    async function loadData() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;"><div class="spinner" style="margin: 2rem auto;"></div></td></tr>';

      const search = document.getElementById('search-input').value.trim();
      const params = {};
      if (search) params.search = search;

      const res = await Admin.getUsers(params);
      
      if (res.ok) {
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem; color: var(--text-secondary);">No users found.</td></tr>';
          return;
        }

        tbody.innerHTML = res.data.map(u => `
          <tr>
            <td style="font-weight: 500;">
              ${u.name}
              ${u.userType === 'admin' ? '<i data-lucide="shield" style="width:14px; color:var(--aurora-purple); margin-left:4px;"></i>' : ''}
            </td>
            <td style="font-family: monospace;">${u.studentId || u.facultyId || '-'}</td>
            <td><span class="badge" style="background:var(--glass); color:var(--white);">${u.userType}</span></td>
            <td>${u.department || '-'}</td>
            <td>
              <div style="font-size: 0.8rem;"><i data-lucide="mail" style="width:12px; margin-right:4px;"></i>${u.email}</div>
              <div style="font-size: 0.8rem; margin-top:2px;"><i data-lucide="phone" style="width:12px; margin-right:4px;"></i>${u.phone || '-'}</div>
            </td>
            <td>${formatDate(u.createdAt)}</td>
            <td>
              ${u.userType !== 'admin' ? `
                <button class="action-btn" title="Delete User" style="color:var(--danger);" onclick="deleteUser('${u._id}')">
                  <i data-lucide="trash-2" style="width:18px;"></i>
                </button>
              ` : '-'}
            </td>
          </tr>
        `).join('');
        initLucide();
      } else {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem; color: var(--danger);">Failed to load data.</td></tr>';
      }
    }

    async function deleteUser(id) {
      if(!confirm(`WARNING: Are you sure you want to delete this user? This cannot be undone.`)) return;
      const res = await Admin.deleteUser(id);
      if (res.ok) {
        showToast('User deleted successfully');
        loadData();
      } else {
        showToast(res.data.message || 'Failed to delete user', 'error');
      }
    }
  </script>
</body>
</html>
