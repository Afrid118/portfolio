<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Lost &amp; Found Portal For Campus</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .admin-auth {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050811; /* Even darker for admin */
      padding: 1rem;
    }
    .admin-card {
      width: 100%;
      max-width: 400px;
      border-top: 4px solid var(--aurora-purple);
    }
  </style>
</head>
<body>

  <div class="admin-auth">
    <div class="glass-card admin-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display:inline-flex; align-items:center; justify-content:center; width: 64px; height: 64px; background: rgba(139, 92, 246, 0.2); border-radius: 50%; margin-bottom: 1rem;">
          <i data-lucide="shield" style="width: 32px; height: 32px; color: var(--aurora-purple);"></i>
        </div>
        <h2>Admin Portal</h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem;">Lost &amp; Found Portal For Campus Administrator</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="submit-btn">
          Secure Login
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="./login.html" style="color: var(--text-secondary); font-size: 0.875rem; text-decoration: none;">
          &larr; Back to Student/Faculty Login
        </a>
      </div>
    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script>
    initLucide();
    
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';

      const res = await Auth.login({ email, password });
      
      btn.disabled = false;
      btn.innerHTML = 'Secure Login';

      if (res.ok) {
        if (!res.data.data || res.data.data.userType !== 'admin') {
          showToast('Access denied. Admin account required.', 'error');
          clearAuth();
          return;
        }
        setAuth(res.data.token, res.data.data);
        window.location.href = './admin-dashboard.html';
      } else {
        showToast(res.data.message || 'Login failed', 'error');
      }
    });
  </script>
</body>
</html>
