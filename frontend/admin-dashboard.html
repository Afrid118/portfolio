<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Lost &amp; Found Portal For Campus</title>
  <link rel="stylesheet" href="./css/main.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="aurora-bg">

  <div id="navbar"></div>

  <!-- Admin Sidebar -->
  <aside class="sidebar" id="admin-sidebar">
    <div style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin: 1rem 1rem 0.5rem;">Management</div>
    <a href="./admin-dashboard.html" class="sidebar-link active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
    <a href="./admin-reports.html" class="sidebar-link"><i data-lucide="file-text"></i> Reports</a>
    <a href="./admin-claims.html" class="sidebar-link"><i data-lucide="shield-check"></i> Claims</a>
    <a href="./admin-users.html" class="sidebar-link"><i data-lucide="users"></i> Users</a>
  </aside>

  <div class="admin-main main-content" style="padding-top: 70px;">
    <div class="container" style="max-width: 100%;">
      
      <h1 style="margin-bottom: 1.5rem;">Admin Dashboard</h1>

      <!-- Stats -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
        <div class="glass-card stat-card">
          <div class="label">Total Users</div>
          <div class="value" id="stat-users">-</div>
        </div>
        <div class="glass-card stat-card">
          <div class="label">Total Lost Reports</div>
          <div class="value" style="color: var(--danger);" id="stat-lost">-</div>
        </div>
        <div class="glass-card stat-card">
          <div class="label">Total Found Reports</div>
          <div class="value" style="color: var(--aurora-green);" id="stat-found">-</div>
        </div>
        <div class="glass-card stat-card">
          <div class="label">Pending Approval</div>
          <div class="value" style="color: var(--warning);" id="stat-pending">-</div>
        </div>
        <div class="glass-card stat-card">
          <div class="label">Claim Requests</div>
          <div class="value" style="color: var(--aurora-purple);" id="stat-claims">-</div>
        </div>
      </div>

      <div class="admin-summary-grid">
        <!-- Pending Reports -->
        <div class="glass-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h3 style="margin:0;">Recent Pending Reports</h3>
            <a href="./admin-reports.html?status=pending" style="color:var(--aurora-cyan); font-size:0.875rem;">View all</a>
          </div>
          <div style="overflow-x: auto;">
            <table style="width:100%; border-collapse:collapse; text-align:left;">
              <thead>
                <tr style="border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.875rem;">
                  <th style="padding: 0.5rem 0;">Type</th>
                  <th style="padding: 0.5rem;">Item</th>
                  <th style="padding: 0.5rem;">Date</th>
                </tr>
              </thead>
              <tbody id="pending-table">
                <tr><td colspan="3" style="text-align:center; padding:1rem;"><div class="spinner" style="margin:auto;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pending Claims -->
        <div class="glass-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h3 style="margin:0;">Recent Pending Claims</h3>
            <a href="./admin-claims.html?status=pending" style="color:var(--aurora-cyan); font-size:0.875rem;">View all</a>
          </div>
          <div style="overflow-x: auto;">
            <table style="width:100%; border-collapse:collapse; text-align:left;">
              <thead>
                <tr style="border-bottom: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.875rem;">
                  <th style="padding: 0.5rem 0;">Item</th>
                  <th style="padding: 0.5rem;">Claimant</th>
                  <th style="padding: 0.5rem;">Date</th>
                </tr>
              </thead>
              <tbody id="claims-table">
                <tr><td colspan="3" style="text-align:center; padding:1rem;"><div class="spinner" style="margin:auto;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/navbar.js"></script>
  <script>
    requireAdmin();
    
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavbar('admin-dashboard');
      loadStats();
    });

    async function loadStats() {
      try {
        const statsRes = await Admin.getStats();
        if (statsRes.ok) {
          const s = statsRes.data;
          document.getElementById('stat-users').innerText = s.totalUsers;
          document.getElementById('stat-lost').innerText = s.totalLost;
          document.getElementById('stat-found').innerText = s.totalFound;
          document.getElementById('stat-pending').innerText = s.pendingReports;
          document.getElementById('stat-claims').innerText = s.claimRequests;
        }

        // Load Pending Reports
        const repRes = await Items.adminGetAll({ status: 'pending', limit: 5 });
        const pt = document.getElementById('pending-table');
        if (repRes.ok && repRes.data.length > 0) {
          pt.innerHTML = repRes.data.map(r => `
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
              <td style="padding: 0.75rem 0;">${getStatusBadge(r.type)}</td>
              <td style="padding: 0.75rem;">${truncate(r.itemName, 20)}</td>
              <td style="padding: 0.75rem; font-size:0.875rem; color:var(--text-secondary);">${formatDate(r.createdAt)}</td>
            </tr>
          `).join('');
        } else {
          pt.innerHTML = '<tr><td colspan="3" style="padding:1rem; text-align:center; color:var(--text-secondary);">No pending reports</td></tr>';
        }

        // Load Pending Claims
        const claimRes = await Claims.adminGetAll({ status: 'pending', limit: 5 });
        const ct = document.getElementById('claims-table');
        if (claimRes.ok && claimRes.data.length > 0) {
          ct.innerHTML = claimRes.data.map(c => `
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
              <td style="padding: 0.75rem 0;">${truncate(c.itemId?.itemName || 'Deleted item', 20)}</td>
              <td style="padding: 0.75rem;">${c.claimantId?.name || 'Deleted user'}</td>
              <td style="padding: 0.75rem; font-size:0.875rem; color:var(--text-secondary);">${formatDate(c.createdAt)}</td>
            </tr>
          `).join('');
        } else {
          ct.innerHTML = '<tr><td colspan="3" style="padding:1rem; text-align:center; color:var(--text-secondary);">No pending claims</td></tr>';
        }

      } catch (e) {
        console.error(e);
        showToast('Error loading dashboard data', 'error');
      }
    }
  </script>
</body>
</html>
