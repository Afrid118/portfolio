<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lost &amp; Found Portal For Campus</title>
  <script>
    if(localStorage.getItem('token')) {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.userType === 'admin') window.location.href = './admin-dashboard.html';
      else window.location.href = './dashboard.html';
    } else {
      window.location.href = './login.html';
    }
  </script>
</head>
<body></body>
</html>
